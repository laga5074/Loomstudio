<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #0A0A0C;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .icon-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(0, 255, 157, 0.15);
      border: 1px solid rgba(0, 255, 157, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .title-area h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }
    .title-area p {
      margin: 2px 0 0 0;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
    }
    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #141418;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #1E1E24;
      border-color: #00FF9D;
      transform: translateY(-1px);
    }
    .btn-icon {
      font-size: 18px;
    }
    .btn-text h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-text p {
      margin: 2px 0 0 0;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
    }
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
    }
    #statusMsg {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 255, 157, 0.1);
      border: 1px solid rgba(0, 255, 157, 0.3);
      color: #00FF9D;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-badge">📸</div>
    <div class="title-area">
      <h1>Web Screen Capture Pro</h1>
      <p>Select your screenshot capture mode</p>
    </div>
  </div>

  <div class="btn-grid">
    <button class="btn" id="btnViewport">
      <span class="btn-icon">🖥️</span>
      <div class="btn-text">
        <h2>Visible Screen / Viewport</h2>
        <p>Capture what is currently visible on tab</p>
      </div>
    </button>

    <button class="btn" id="btnAreaSelect">
      <span class="btn-icon">✂️</span>
      <div class="btn-text">
        <h2>Select Area with Mouse</h2>
        <p>Drag box over webpage to crop region</p>
      </div>
    </button>

    <button class="btn" id="btnFullPage">
      <span class="btn-icon">📜</span>
      <div class="btn-text">
        <h2>Full Page (Tall Image)</h2>
        <p>Auto-scrolls & stitches full long page</p>
      </div>
    </button>
  </div>

  <div id="statusMsg">Processing screenshot...</div>

  <div class="footer">
    Powered by Screen & Reaction Recorder Pro
  </div>

  <script src="popup.js"></script>
</body>
</html>
